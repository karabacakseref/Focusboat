name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android platform folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.fgi.focusboat --project-name focus_boat temp_scaffold
            cp -r temp_scaffold/android ./android
            rm -rf temp_scaffold
          fi

