name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android platform folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.fgi.focusboat --project-name focus_boat temp_scaffold
            cp -r temp_scaffold/android ./android
            rm -rf temp_scaffold
          fi

      - name: Bump Android compileSdk/targetSdk (bazı paketler için gerekli)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/" "$f" || true
              sed -i -E "s/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/" "$f" || true
              sed -i -E "s/targetSdk[[:space:]]*=?[[:space:]]*flutter\.targetSdkVersion/targetSdk = 36/" "$f" || true
              sed -i -E "s/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion 36/" "$f" || true
            fi
          done

      - name: Uygulama simgesini FocusBoat logosuyla değiştir
        run: |
          command -v convert >/dev/null 2>&1 || sudo apt-get update -y && sudo apt-get install -y imagemagick
          declare -A sizes=( [mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size=${sizes[$density]}
            mkdir -p "android/app/src/main/res/$density"
            convert assets/logo_icon.png -resize ${size}x${size} -background white -gravity center -extent ${size}x${size} "android/app/src/main/res/$density/ic_launcher.png"
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-boat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
