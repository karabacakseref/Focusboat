name: focus_boat
description: Focus Boat - PLC kontrol uygulaması (Modbus TCP)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.2
  wakelock_plus: ^1.2.8
  torch_light: ^1.1.0
  flutter_compass: ^0.8.1
  sensors_plus: ^6.0.1
  http: ^1.2.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_icon.png
    - assets/logo_banner.png
